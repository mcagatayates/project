# Shop/account-level constants for the Getvela CSV export
# (app/pipeline/getvela_export.py). Values below were taken directly from
# a real export of the account owner's actual Getvela listing (a
# Printify-fulfilled physical print) -- not guessed. If you change your
# real Etsy category, shipping profile, return policy, or POD partner,
# update this file to match; the export never hardcodes these.

category: "Art & Collectibles > Prints > Digital Prints"
who_made_it: "I did"
what_is_it: "A finished product"
when_was_it_made: "Made To Order"
renewal_options: "Automatic"
production_partners: "Printify"
shipping_profile: "Free Shipping"
return_policy: "30 days to return or exchange"
product_type: "Physical"

# Package shipping dimensions -- left blank (empty CSV cell), matching
# the real reference listing, which also leaves these blank (Printify
# fulfillment doesn't need them set here).
weight_oz: null
length_in: null
width_in: null
height_in: null

# Listing-level stock count Etsy requires even for made-to-order items --
# taken directly from the real reference listing.
quantity_per_listing: 95

# Names of the two Etsy variation dimensions used -- see
# config/getvela_variation_template.csv for the actual Size x Material
# grid and per-combination pricing, taken verbatim from a real Getvela
# export so nothing here is a guessed price.
variation_1_name: "Size"
variation_2_name: "Material"
