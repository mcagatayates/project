[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "UP017",
    "B008", # FastAPI's Depends()/Query() defaults are the intended idiom, not a bug
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["migrations/versions", ".venv"]
